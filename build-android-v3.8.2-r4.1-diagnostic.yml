name: Build Junba Android APK v3.8.2 R4.1 Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-v3.8.2-r4.1-diagnostic.yml'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: junba-v382-r41-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-r41:
    name: Clean Build R4.1 Diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for p in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf /tmp/android-cli && mkdir -p /tmp/android-cli
            unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
            mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: R4.1 diagnostic source preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          test -f android/app/src/main/java/tw/junba/transcriber/TranscriberActivity.java
          test -f android/app/src/main/java/tw/junba/transcriber/FullTranscriberActivity.java
          test -f android/app/src/main/java/tw/junba/transcriber/DiagnosticApplication.java
          test -f android/app/src/main/java/tw/junba/transcriber/LocalWhisperEngine.kt
          test -f android/app/src/main/java/tw/junba/transcriber/AudioPreprocessor.kt
          test -f android/app/src/main/java/tw/junba/transcriber/SecureKeyStore.java
          grep -q 'versionCode = 389' android/app/build.gradle.kts
          grep -q '3.8.2-apk-r4.1-diagnostic' android/app/build.gradle.kts
          grep -q 'R4.1 Diagnostic Launcher' android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          grep -q 'R4.1｜第二層程序已正常啟動' android/app/src/main/java/tw/junba/transcriber/TranscriberActivity.java
          grep -q 'FullTranscriberActivity' android/app/src/main/AndroidManifest.xml
          grep -q 'android:process=":transcriber_gate"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:process=":full_transcriber"' android/app/src/main/AndroidManifest.xml
          grep -q 'r41_last_crash.txt' android/app/src/main/java/tw/junba/transcriber/DiagnosticApplication.java
          grep -q 'r41_last_stage.txt' android/app/src/main/java/tw/junba/transcriber/DiagnosticApplication.java
          if grep -q 'attachBaseContext' android/app/src/main/java/tw/junba/transcriber/FullTranscriberActivity.java; then
            echo 'ERROR: FullTranscriberActivity must not override attachBaseContext in R4.1'
            exit 1
          fi

      - name: Clean compile and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac :app:assembleDebug --no-daemon --stacktrace --refresh-dependencies

      - name: Package APK immediately
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p r
          cp "$APK" 'r/Junba-R4.1-Diagnostic.apk'
          sha256sum 'r/Junba-R4.1-Diagnostic.apk' > r/SHA256.txt
          cat > r/TEST_FIRST.txt <<'TXT'
          R4.1 Diagnostic test sequence:
          1. Uninstall the old Junba AI Transcriber first.
          2. Install Junba-R4.1-Diagnostic.apk.
          3. Open R4.1 Diagnostic Launcher.
          4. Tap "步驟 2：開啟獨立程序 Gate".
          5. If Gate opens, tap "下一步：載入完整轉錄功能".
          6. If full mode disappears/crashes, return to Launcher and tap "重新讀取診斷".
          7. Copy the entire stage + crash text back to ChatGPT.
          TXT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Junba-v382-APK-R4.1-Diagnostic
          path: |
            r/Junba-R4.1-Diagnostic.apk
            r/SHA256.txt
            r/TEST_FIRST.txt
          if-no-files-found: error
          retention-days: 30

      - name: Optional APK diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] || exit 0
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" || true
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK" || true
          unzip -l "$APK" | grep -E 'classes|lib/arm64-v8a|AndroidManifest' | head -n 100 || true

      - uses: actions/attest-build-provenance@v2
        if: success()
        with:
          subject-path: r/Junba-R4.1-Diagnostic.apk
